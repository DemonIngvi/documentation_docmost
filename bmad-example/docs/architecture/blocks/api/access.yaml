id: api-access
title: Доступ
kind: service
does:
- ведёт пользователей, Project, Team и Role
- проверяет вход и API-токены
- выдаёт `ProjectScope` другим модулям
- скрывает чужой Project и отклоняет действие без нужной Role
tech: NestJS 12.3.2
stories:
- '1.1'
io:
- dir: in
  with: модули work и process
  what: запрос `ProjectScope`
- dir: in
  with: web
  what: вход и команды
  via: I-web
data:
- table: project
  access: read-write
- table: team
  access: read-write
- table: role
  access: read-write
- table: user
  access: read-write
- table: api_token
  access: read-write
params:
- session.ttl.hours
reqs:
- FR-1
- FR-2
- FR-23
tasks:
- '1.1'
on_failure: Чужой Project даёт 404, нехватка Role даёт 403. Если база недоступна, запрос отклоняется и права не
  считаются выданными (FMEA S1).
why: Права проверяются в одном модуле, поэтому запрос чтения без `ProjectScope` не компилируется (AD-7, AD-12).
functions:
- project-manage
- team-role-manage
- user-auth
operations:
- name: ProjectScope.forUser
  caller: work, process
  via: внутри
- name: POST /projects
  caller: web
  via: I-web
