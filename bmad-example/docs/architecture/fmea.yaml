rows:
- target: I-web
  failure: Сервер не отвечает
  detection: таймаут клиента
  behavior: экран показывает ошибку, данные не теряются
  recovery: повтор действия пользователем
- target: I-realtime
  failure: Соединение оборвано
  detection: событие закрытия сокета
  behavior: Board показывает устаревшие данные с отметкой
  recovery: переподключение и перечитывание
- target: I-rest
  failure: Клиент повторяет запрос
  detection: ключ идемпотентности не задан
  behavior: повтор может создать дубль
  recovery: клиент проверяет результат
- target: I-webhook
  failure: Получатель недоступен
  detection: ошибка или таймаут доставки
  behavior: событие остаётся в outbox
  recovery: повторы, затем отметка об ошибке
- target: I-queue
  failure: Redis недоступен
  detection: ошибка подключения
  behavior: ИИ-функции показывают причину, работа без ИИ продолжается
  recovery: переподключение, задача ставится заново
- target: I-model
  failure: Модель недоступна
  detection: таймаут или ошибка ответа
  behavior: AI Suggestion не создаётся, показывается причина
  recovery: повторы, затем ручная работа
- target: S1
  failure: База недоступна
  detection: ошибка подключения, проверка здоровья
  behavior: запросы отклоняются, права не считаются выданными
  recovery: перезапуск службы
- target: S2
  failure: Потеря данных Redis
  detection: задачи и сессии исчезли
  behavior: пользователи входят заново, задачи ИИ ставятся заново
  recovery: перезапуск службы
